# GRID Legends Host: VXpro's VX Mac Host (third_party/VXpro/app) built for GRID Legends. Its sources are used from the
# submodule as they are, except host.m (app/Sources/host.m, generated by tools/sync_host.py) and GRID's own
# grid_profile.m. Signing: Signing.xcconfig (your values in Local.xcconfig, git-ignored). Build first:
#   make -C ../shims                          the shims -> ../build/xros   (simulator: make -C ../shims sim)
#   ../tools/grid_prepare.py --check-imports  the game's executable -> ../build/prepared/Frameworks
#   xcodegen && xcodebuild -scheme GRIDHost -destination generic/platform=visionOS -allowProvisioningUpdates build
name: GRIDHost
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) VXFP_SLOTS=4"
    XROS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "7"
    SUPPORTED_PLATFORMS: "xros xrsimulator"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GRIDHost:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: ../build/grid/Assets.xcassets   # the icon, made by tools/make_icon.swift at build time
        optional: true
      - path: ../third_party/VXpro/app/Sources
        excludes:
          - host.m
          - Info.plist
          - VXMacHost.entitlements
      - path: ../third_party/VXpro/vr/xros_vr.m
      - path: ../third_party/VXpro/vr/warp_core.m
      - path: ../third_party/VXpro/vr/frame_pipeline.c
      - path: ../third_party/VXpro/vr/hand_gestures.c
      - path: ../third_party/VXpro/vr/hand_weapon.c
      - path: ../third_party/VXpro/vr/vxmac_vr_glue.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GRID_BUNDLE_ID)"
        PRODUCT_NAME: GRIDHost
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/GRIDHost.entitlements
        CLANG_ENABLE_OBJC_ARC: YES
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: ../third_party/VXpro/app/Sources/VXMacHost-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../third_party/VXpro/vr $(SRCROOT)/../third_party/VXpro/shims $(SRCROOT)/../third_party/VXpro/app/Sources"
        OTHER_LDFLAGS: "-L$(SRCROOT)/../build/xros -lvxkit -lvxmtl -lvxmtlfx"
        "OTHER_LDFLAGS[sdk=xrsimulator*]": "-L$(SRCROOT)/../build/xrsim -lvxkit -lvxmtl -lvxmtlfx"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed shims and the game's prepared executable
        script: "\"$SRCROOT/embed_images.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: GameController.framework
      - sdk: Vision.framework
      - sdk: CoreVideo.framework
      - sdk: CoreML.framework
      - sdk: libcompression.tbd
